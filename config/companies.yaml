# Config-driven company definitions. Adding a company = adding a block here + its data files.
# No financial NUMBERS live in this file. Numbers live in data/raw/<key>_financials.csv
# (tidy long format, every row carries source + source_date). Judgement calls live in
# notes/assumptions.md and are referenced by id from `assumptions:` below.

defaults:
  forecast_years: 10            # explicit forecast horizon (project spec)
  units: "INR crore"            # reporting unit unless a company overrides
  share_unit: "crore shares"    # must equal the `unit` on share rows so amounts/shares scales agree
  segment_tolerance_pct: 0.5    # |sum(segments) - consolidated revenue| allowed, % of consolidated
  # Equity bridge (A8, A9). Weights: fraction of each ASSET counted (1 = liquid, 0 = excluded).
  # Claims are deducted at book value. Leases are deducted because EBIT is pre-lease-interest.
  bridge:
    asset_weights:
      cash_and_cash_equivalents: 1
      bank_balances_other: 1
      current_investments: 1
      non_current_investments: 0    # ASSUMPTION A8: excluded until the note is reviewed
    claims:
      - borrowings
      - lease_liabilities
      - non_controlling_interest
  sensitivity_steps:                # grid spacing (ASSUMPTION: presentation only)
    wacc: 0.01
    terminal_growth: 0.005
    revenue_cagr: 0.02
    terminal_ebit_margin: 0.02
  tolerances:                       # workbook check tolerances (fractions)
    balance_sheet: 0.005
    value_vs_python: 0.001
    price_reproduction: 0.001
    grid_centre: 0.001
    esop_overlap_flag: 0.02
    beta_z: 1.96
  discounting:
    mid_year: false                 # A13
  forecast:
    growth_profile: "constant"      # A14: "constant" or "linear_fade"
    margin_ramp_years: null         # null = reach terminal margin in year N
  # Monte Carlo (M4). ALL parameters are ASSUMPTIONS for you to set (A23-A27). They must be set from
  # history/peers/theory, never fitted to the market price (circular). Null = run refuses.
  monte_carlo:
    n_sims: 10000
    seed: 20250101                  # recorded in every output; same seed -> identical results
    correlation_cagr_margin: {value: 0.3, ref: "A26"}   # documented default, see assumptions.md
    distributions:
      revenue_cagr:
        {type: triangular, low: null, mode: null, high: null,
         rationale: "Bounded, skewed; anchor low/mode/high to worst/base/best 10y growth from history and mature-peer trajectories"}
      terminal_ebit_margin:
        {type: triangular, low: null, mode: null, high: null,
         rationale: "Bounded by peer/mature-platform margin range (sources C1-C4), not by the price"}
      wacc:
        {type: truncated_normal, mean: null, sd: null, low: null, high: null,
         rationale: "Centre on the CAPM WACC; sd reflects beta standard error and ERP uncertainty; truncated to a plausible band"}
      terminal_growth:
        {type: triangular, low: null, mode: null, high: null,
         rationale: "Bounded above by INR risk-free rate / long-run nominal GDP growth"}
  beta:                             # A6 / A12
    index: "NIFTY 50"
    window_years: 2
    frequency: "W"                  # weekly
    blume_adjust: false
  # Line items every company must supply (loader flags any that are missing).
  required_line_items:
    income_statement:
      - revenue_from_operations
      - total_expenses
      - depreciation_amortisation
      - finance_costs
      - other_income
      - share_based_payment_expense  # ESOP cost; must already sit inside total_expenses (verify)
      - profit_before_tax
      - tax_expense
      - net_profit
    balance_sheet:
      - cash_and_cash_equivalents
      - bank_balances_other
      - current_investments
      - non_current_investments
      - borrowings
      - lease_liabilities
      - non_controlling_interest
      - total_equity
      - total_assets
      - total_liabilities            # used by the workbook balance check (assets = equity + liabilities)
    tax:
      - unabsorbed_tax_losses        # amount of carried-forward losses (not the deferred-tax effect)
    esop:
      - esop_unamortised_cost        # A11b overlap check (point in time)
    cash_flow:
      - cfo
      - capex_ppe_intangibles
    share_data:
      - shares_outstanding_basic
      - shares_outstanding_diluted   # incl. ESOP/dilutive instruments; needed for per-share value

companies:
  eternal:
    name: "Eternal Ltd (formerly Zomato Ltd)"
    ticker: "ETERNAL"
    exchange: "NSE"
    country: "India"
    currency: "INR"
    statements: "consolidated"
    fiscal_year_end_month: 3          # March
    first_fy: 2022                    # first fiscal year to load (FY2022 = year ended 31-Mar-2022)
    last_fy: 2026                     # latest audited FY in the data (year ended 31-Mar-2026)
    assumptions_as_of: null           # ISO date you set the assumptions below (recorded as their source date)
    data_file: "data/raw/eternal_financials.csv"
    market_data_file: "data/raw/eternal_market.csv"     # price, shares, valuation date (see notes/SOURCES_NEEDED.md)
    segments:                         # names must match latest filing's segment note; verify before use
      - food_delivery
      - quick_commerce                # Blinkit
      - hyperpure
      - going_out
      - all_other                     # 'All other segments (Residual)' in the Q1FY27 segment note (p.26)
    benchmarks:
      market_index: "NIFTY 50"        # beta regression index
      risk_free: "India 10Y G-Sec yield"
      erp_source: "Damodaran country ERP (India)"
      peers:
        - {name: "Swiggy Ltd", ticker: "SWIGGY", exchange: "NSE", role: "direct domestic peer"}
        - {name: "DoorDash Inc", ticker: "DASH", exchange: "NASDAQ", role: "mature global delivery"}
        - {name: "Meituan", ticker: "3690", exchange: "HKEX", role: "mature global local-services"}
    # ------------------------------------------------------------------------------------------------
    # PRELIMINARY - ILLUSTRATIVE ASSUMPTIONS.  Off by default.  Turn on with `--preliminary` on the CLI or
    # `enabled: true` here. Every value below is a ROUND ILLUSTRATIVE number for tonight's first pass, NOT
    # evidence-based (see notes/assumptions.md, section "PRELIMINARY"). Edit freely. With the mode off the
    # normal refusal gates apply and the blank assumptions above still block the run.
    # ------------------------------------------------------------------------------------------------
    preliminary:
      enabled: false
      label: "PRELIMINARY - ILLUSTRATIVE ASSUMPTIONS"
      price: {value: null, date: null}          # YOU supply: approximate market price (INR) and its date
      first_fy: 2026                            # single filing supplied: history is FY2026 only
      forecast: {base: LTM}                     # LTM = FY26 + Q1FY27 - Q1FY26
      market:                                   # ILLUSTRATIVE, not measured
        rf: 0.07
        erp: 0.07
        beta: 1.2                               # assumed input, not a regression
        beta_se: 0.25
      point_inputs:                             # placeholders for items NOT in the Q1FY27 filing
        shares_outstanding_diluted: {value: 921, unit: "crore shares", rows: [[POINT, "2026-06-30"]],
          note: "APPROXIMATE: paid-up capital INR 921 crore / face value INR 1 (PDF p.25); no ESOP dilution added"}
        shares_outstanding_basic: {value: 921, unit: "crore shares", rows: [[POINT, "2026-06-30"]],
          note: "APPROXIMATE: paid-up capital INR 921 crore / face value INR 1 (PDF p.25)"}
        unabsorbed_tax_losses: {value: 0, unit: "INR crore", rows: [[POINT, "2026-06-30"]],
          note: "PLACEHOLDER: not in the Q1FY27 filing; 0 = no loss shield credited (conservative)"}
        esop_unamortised_cost: {value: 0, unit: "INR crore", rows: [[POINT, "2026-06-30"]],
          note: "PLACEHOLDER: not in the filing; the ESOP-overlap check is NOT ASSESSED in this mode"}
        borrowings: {value: 0, unit: "INR crore", rows: [[FY, "2026-03-31"], [Q, "2026-06-30"]],
          note: "no borrowings line on the balance sheet (PDF p.18); 0 assumed, unconfirmed against the notes"}
      assumptions:
        terminal_growth: 0.05
        terminal_ebit_margin_range: [0.05, 0.12]
        base_case_terminal_ebit_margin: 0.08
        sales_to_capital: 3.0
        cost_of_debt_pretax: 0.09
        target_debt_weight: 0.05
        tax_rate_statutory: 0.25
        tax_rate_terminal: 0.25
        base_case_revenue_cagr: 0.20
      monte_carlo:
        correlation_cagr_margin: 0.3
        distributions:
          revenue_cagr: {type: triangular, low: 0.10, mode: 0.20, high: 0.30}
          terminal_ebit_margin: {type: triangular, low: 0.04, mode: 0.08, high: 0.12}
          wacc: {type: truncated_normal, mean: 0.15, sd: 0.01, low: 0.12, high: 0.18}
          terminal_growth: {type: triangular, low: 0.04, mode: 0.05, high: 0.06}

    # Judgement inputs: value stays null until YOU set it; each maps to an entry in notes/assumptions.md
    assumptions:
      terminal_growth: {value: null, ref: "A1"}
      base_case_revenue_cagr: {value: null, ref: "A23"}        # point estimate feeding the base-case DCF
      base_case_terminal_ebit_margin: {value: null, ref: "A2"} # point estimate inside the A2 range
      tax_rate_statutory: {value: null, ref: "A7"}
      terminal_ebit_margin_range: {value: null, ref: "A2"}   # [low, high]; shades the frontier plot
      sales_to_capital: {value: null, ref: "A3"}
      cost_of_debt_pretax: {value: null, ref: "A4"}
      target_debt_weight: {value: null, ref: "A5"}
      tax_rate_terminal: {value: null, ref: "A7"}

