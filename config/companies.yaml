# Config-driven company definitions. Adding a company = adding a block here + its data files.
# No financial NUMBERS live in this file. Numbers live in data/raw/<key>_financials.csv
# (tidy long format, every row carries source + source_date). Judgement calls live in
# notes/assumptions.md and are referenced by id from `assumptions:` below.

defaults:
  forecast_years: 10            # explicit forecast horizon (project spec)
  units: "INR crore"            # reporting unit unless a company overrides
  share_unit: "crore shares"    # must equal the `unit` on share rows so amounts/shares scales agree
  segment_tolerance_pct: 0.5    # |sum(segments) - consolidated revenue| allowed, % of consolidated
  # Equity bridge (A8, A9). Weights: fraction of each ASSET counted (1 = liquid, 0 = excluded).
  # Claims are deducted at book value. Leases are deducted because EBIT is pre-lease-interest.
  bridge:
    asset_weights:
      cash_and_cash_equivalents: 1
      bank_balances_other: 1
      current_investments: 1
      non_current_investments: 0    # ASSUMPTION A8: excluded until the note is reviewed
    claims:
      - borrowings
      - lease_liabilities
      - non_controlling_interest
  discounting:
    mid_year: false                 # A13
  forecast:
    growth_profile: "constant"      # A14: "constant" or "linear_fade"
    margin_ramp_years: null         # null = reach terminal margin in year N
  # Monte Carlo (M4). ALL parameters are ASSUMPTIONS for you to set (A23-A27). They must be set from
  # history/peers/theory, never fitted to the market price (circular). Null = run refuses.
  monte_carlo:
    n_sims: 10000
    seed: 20250101                  # recorded in every output; same seed -> identical results
    correlation_cagr_margin: {value: 0.3, ref: "A26"}   # documented default, see assumptions.md
    distributions:
      revenue_cagr:
        {type: triangular, low: null, mode: null, high: null,
         rationale: "Bounded, skewed; anchor low/mode/high to worst/base/best 10y growth from history and mature-peer trajectories"}
      terminal_ebit_margin:
        {type: triangular, low: null, mode: null, high: null,
         rationale: "Bounded by peer/mature-platform margin range (sources C1-C4), not by the price"}
      wacc:
        {type: truncated_normal, mean: null, sd: null, low: null, high: null,
         rationale: "Centre on the CAPM WACC; sd reflects beta standard error and ERP uncertainty; truncated to a plausible band"}
      terminal_growth:
        {type: triangular, low: null, mode: null, high: null,
         rationale: "Bounded above by INR risk-free rate / long-run nominal GDP growth"}
  beta:                             # A6 / A12
    index: "NIFTY 50"
    window_years: 2
    frequency: "W"                  # weekly
    blume_adjust: false
  # Line items every company must supply (loader flags any that are missing).
  required_line_items:
    income_statement:
      - revenue_from_operations
      - total_expenses
      - depreciation_amortisation
      - finance_costs
      - other_income
      - share_based_payment_expense  # ESOP cost; must already sit inside total_expenses (verify)
      - profit_before_tax
      - tax_expense
      - net_profit
    balance_sheet:
      - cash_and_cash_equivalents
      - bank_balances_other
      - current_investments
      - non_current_investments
      - borrowings
      - lease_liabilities
      - non_controlling_interest
      - total_equity
      - total_assets
      - total_liabilities            # used by the workbook balance check (assets = equity + liabilities)
    tax:
      - unabsorbed_tax_losses        # amount of carried-forward losses (not the deferred-tax effect)
    cash_flow:
      - cfo
      - capex_ppe_intangibles
    share_data:
      - shares_outstanding_basic
      - shares_outstanding_diluted   # incl. ESOP/dilutive instruments; needed for per-share value

companies:
  eternal:
    name: "Eternal Ltd (formerly Zomato Ltd)"
    ticker: "ETERNAL"
    exchange: "NSE"
    country: "India"
    currency: "INR"
    statements: "consolidated"
    fiscal_year_end_month: 3          # March
    first_fy: 2022                    # first fiscal year to load (FY2022 = year ended 31-Mar-2022)
    last_fy: null                     # set to latest reported FY once data file is filled
    data_file: "data/raw/eternal_financials.csv"
    market_data_file: "data/raw/eternal_market.csv"     # price, shares, valuation date (see notes/SOURCES_NEEDED.md)
    segments:                         # names must match latest filing's segment note; verify before use
      - food_delivery
      - quick_commerce                # Blinkit
      - hyperpure
      - going_out
    benchmarks:
      market_index: "NIFTY 50"        # beta regression index
      risk_free: "India 10Y G-Sec yield"
      erp_source: "Damodaran country ERP (India)"
      peers:
        - {name: "Swiggy Ltd", ticker: "SWIGGY", exchange: "NSE", role: "direct domestic peer"}
        - {name: "DoorDash Inc", ticker: "DASH", exchange: "NASDAQ", role: "mature global delivery"}
        - {name: "Meituan", ticker: "3690", exchange: "HKEX", role: "mature global local-services"}
    # Judgement inputs: value stays null until YOU set it; each maps to an entry in notes/assumptions.md
    assumptions:
      terminal_growth: {value: null, ref: "A1"}
      tax_rate_statutory: {value: null, ref: "A7"}
      terminal_ebit_margin_range: {value: null, ref: "A2"}
      sales_to_capital: {value: null, ref: "A3"}
      cost_of_debt_pretax: {value: null, ref: "A4"}
      target_debt_weight: {value: null, ref: "A5"}
      tax_rate_terminal: {value: null, ref: "A7"}

